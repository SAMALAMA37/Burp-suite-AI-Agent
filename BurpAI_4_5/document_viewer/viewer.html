<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="@@POLICY@@">
<meta name="referrer" content="no-referrer">
<title>@@TITLE@@ · BurpAI Notes</title>
<style>@@CSS@@</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">B<span>·</span></span><span>BurpAI <strong>Notes</strong></span></div>
  <div class="actions">
    <button id="copy" title="Copy the original Markdown">Copy Markdown</button>
    <button id="download">Download .md</button>
    <button id="print">Print / PDF</button>
    <button id="theme" aria-label="Toggle dark theme">Dark theme</button>
  </div>
</header>
<main>
  <aside class="sidebar">
    <div class="eyebrow">YOUR LOCAL LIBRARY</div>
    <div class="sidebar-label">A little structure.<br>A clearer picture.</div>
    <div id="kind-badge" class="kind-badge">MARKDOWN NOTE</div>
    <div class="nav-label">ON THIS PAGE</div>
    <nav id="outline" aria-label="Document outline"></nav>
    <div class="sidebar-footer"><span class="status-dot"></span> Saved on your computer<br><span>Open again any time. Works offline.</span></div>
  </aside>
  <section class="document">
    <div class="eyebrow" id="eyebrow">FIELD NOTES</div>
    <h1 id="title">@@TITLE@@</h1>
    <div id="metadata" class="metadata"></div>
    <div id="tags" class="tags"></div>
    <div id="map-controls" class="map-controls" hidden>
      <div class="segmented"><button id="view-map" class="active">Visual map</button><button id="view-outline">Outline</button></div>
      <div class="map-tools"><button id="expand">Expand all</button><button id="collapse">Collapse branches</button><button id="export-svg">Save SVG</button></div>
    </div>
    <section id="map-panel" hidden aria-label="Interactive mind map">
      <div class="map-caption"><span><span class="status-dot"></span> EXPLORE THE CONNECTIONS</span><span id="map-count"></span></div>
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mind map. Drag to pan, scroll to zoom, click a branch to collapse it."></svg>
      <div class="map-bottom"><span>Drag to pan · Scroll to zoom · Click a branch to fold</span><div><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit">Fit map</button><button id="zoom-in" aria-label="Zoom in">+</button></div></div>
    </section>
    <article id="reader" class="prose"></article>
    <footer class="document-footer"><span>BURPAI / NOTES & MAPS</span><span id="revision"></span></footer>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="noscript">This preview needs JavaScript to format the note. The .md file beside it contains the original text.</p></noscript>
<script id="document-data" type="application/json">@@DATA@@</script>
<script>@@VENDOR@@</script>
<script>@@SCRIPT@@</script>
</body>
</html>
